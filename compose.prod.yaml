include:
  - compose.yaml
services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - jenkins
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: dev.briantambara.com
      SSL_CERTIFICATE: /etc/letsencrypt/live/dev.briantambara.com/fullchain.pem
      SSL_CERTIFICATE_KEY: /etc/letsencrypt/live/dev.briantambara.com/privkey.pem
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - /etc/letsencrypt:/etc/letsencrypt:ro,Z
      - certbot-var:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-var:
